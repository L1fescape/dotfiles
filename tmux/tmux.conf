# Set tmux binding to ctrl-z
unbind C-b
set -g prefix C-z
bind-key z send-prefix

# set history to 100000 from 2000
set -g history-limit 100000

# set base tab index to 1 as opposed to 0
set -g base-index 1

# window is only resized if the smaller client is actively looking at it
setw -g aggressive-resize on

# Terminal and colors (tmux 3+; falls back if terminfo missing)
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"
set -as terminal-overrides ",screen-256color:RGB"
set -g status-bg colour235
set -g status-fg white

# Bind  to last window, not bg
unbind ^Z
bind ^Z last-window

# Turn off delay for esc mode / vi keys
set -sg escape-time 10

# change tab status when something happens in that tab
setw -g monitor-activity on
set -g visual-activity on

# Mouse mode on by default
set -g mouse on

# vi-style copy mode (prefix is C-z)
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi WheelUpPane   send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 2 scroll-down
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind Space copy-mode

# move around panes with hjkl, like in vim after pressing ctrl-w
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes
# minus and plus keys move left and right (technically minus and equal keys)
# shift + minus and plus keys move down and up
bind - resize-pane -L 20
bind = resize-pane -R 20
bind _ resize-pane -D 5
bind + resize-pane -U 5

bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

# split panes horizontally and vertically
bind-key | split-window -h
unbind '\'
bind-key \\ split-window -v

# reload configuration
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'
